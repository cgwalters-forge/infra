name: Build chunkah-staged bootc base images

on:
  push:
    branches: [main]
    paths:
      - 'staged-images/**'
      - '.github/workflows/staged-image-pipeline.yml'
      - '.github/workflows/build-staged-images.yml'
  pull_request:
    branches: [main]
    paths:
      - 'staged-images/**'
      - '.github/workflows/staged-image-pipeline.yml'
      - '.github/workflows/build-staged-images.yml'
  schedule:
    # Rebuild weekly to pick up upstream base image updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Read sources.json and generate the per-image matrix.
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - id: matrix
        run: echo "images=$(just staged-images/ci-matrix)" >> "$GITHUB_OUTPUT"

  # Each image runs through its own instance of staged-image-pipeline.yml, so
  # its jobs gate only on that image's results.
  image:
    name: ${{ matrix.name }}:${{ matrix.tag }}
    needs: generate-matrix
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.images) }}
    uses: ./.github/workflows/staged-image-pipeline.yml
    with:
      name: ${{ matrix.name }}
      tag: ${{ matrix.tag }}
